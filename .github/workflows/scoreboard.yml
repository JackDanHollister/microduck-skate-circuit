name: Check scoreboard
on:
  pull_request:
    paths:
      - 'lineage/**'
      - 'run_tree.py'
      - 'race.py'
      - 'data/reinvent2018.json'
      - 'requirements.txt'
      - '.github/workflows/scoreboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 run_tree.py check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python run_tree.py verify-scores --workers 2
